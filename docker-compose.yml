version: "3.9"

# =============================================================================
# Autonomous Engineering Intelligence Platform — Docker Compose
# =============================================================================
# Usage:
#   docker-compose up -d                  # Start all services
#   docker-compose up -d postgres redis   # Start only infrastructure
#   docker-compose logs -f backend        # Tail backend logs
#   docker-compose down -v                # Stop and remove volumes

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  aeip-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  grafana_data:
  otel_data:

services:

  # ============================================================
  # PostgreSQL — Primary durable state store
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: aeip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeip
      POSTGRES_PASSWORD: aeip_password
      POSTGRES_DB: aeip
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - aeip-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeip -d aeip"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ============================================================
  # Redis — Queue, cache, rate limiting, event streaming
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: aeip-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aeip-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ============================================================
  # Qdrant — Vector database for semantic retrieval
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: aeip-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    networks:
      - aeip-net
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ============================================================
  # MinIO — S3-compatible object storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: aeip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aeip_minio
      MINIO_ROOT_PASSWORD: aeip_minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      - aeip-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ============================================================
  # MinIO initialization — create default bucket
  # ============================================================
  minio-init:
    image: minio/mc:latest
    container_name: aeip-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - aeip-net
    entrypoint: >
      /bin/sh -c "
        mc alias set aeip http://minio:9000 aeip_minio aeip_minio_secret;
        mc mb --ignore-existing aeip/aeip-artifacts;
        mc anonymous set none aeip/aeip-artifacts;
        echo 'MinIO bucket initialized.';
      "

  # ============================================================
  # OpenTelemetry Collector
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: aeip-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics (collector self-metrics)
    networks:
      - aeip-net
    depends_on:
      - prometheus
    logging: *default-logging

  # ============================================================
  # Prometheus — Metrics collection
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aeip-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - aeip-net
    logging: *default-logging

  # ============================================================
  # Grafana — Dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: aeip-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - aeip-net
    depends_on:
      - prometheus
    logging: *default-logging

  # ============================================================
  # Backend — FastAPI application
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: aeip-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://aeip:aeip_password@postgres:5432/aeip"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      STORAGE_ENDPOINT: "http://minio:9000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - ./backend:/app
      - ./git_workspaces:/git_workspaces
    ports:
      - "8000:8000"   # FastAPI
      - "9091:9090"   # Prometheus metrics (backend)
    networks:
      - aeip-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ============================================================
  # Frontend — Next.js dashboard
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: aeip-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - aeip-net
    depends_on:
      - backend
    logging: *default-logging

  # ============================================================
  # Sandbox — Isolated code execution environment
  # ============================================================
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: aeip-sandbox
    restart: unless-stopped
    environment:
      SANDBOX_TIMEOUT: "60"
    volumes:
      - ./sandbox/runner:/runner
    networks:
      - aeip-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    logging: *default-logging
